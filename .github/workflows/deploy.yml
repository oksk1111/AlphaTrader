name: Deploy to Oracle Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================================================
  # [v6.0] 배포 전 전략 검증 게이트
  #
  # 이 잡이 없어서 "돌아는 가는데 아무것도 사지 않는" 전략이 몇 달간 프로덕션에
  # 머물렀다. 문법도 맞고 프로세스도 살아 있고 예외도 안 났기 때문에 어떤 자동
  # 검사도 이를 잡지 못했다. 이제 매수가 실제로 발생하는지를 배포 조건으로 만든다.
  # ==========================================================================
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Syntax check
        run: python -c "import ast, io; ast.parse(io.open('run_bot.py', encoding='utf-8').read())"

      - name: Unit & integration tests
        # 외부 KIS API 를 실제로 호출하는 두 테스트는 CI 에 자격증명이 없으므로 제외.
        run: |
          pytest tests/ -q             --ignore=tests/test_find_etfs.py             --ignore=tests/test_portfolio_manager.py

      - name: v6.0 회귀 테스트 (5대 사고 원인)
        run: pytest tests/test_v60_strategy.py tests/test_v60_integration.py -q

      - name: 전략 검증 루프 (국면별 노출도 단조성)
        # 종료코드 0 = 합격. 상승장에서 자본이 놀거나(v5.x 회귀), 폭락장에서
        # 과다 노출이면(v4.0 회귀) 실패하여 배포가 중단된다.
        run: |
          python scripts/verify_strategy_loop.py --sessions 80 --seed 42
          python scripts/verify_strategy_loop.py --sessions 80 --seed 7

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            echo "🚀 Starting deployment via GitHub Actions..."
            REPO_DIR="$HOME/AlphaTrader"
            LEGACY_DIR="$HOME/Alphatrader"

            if [ -d "$REPO_DIR" ]; then
              cd "$REPO_DIR"
            elif [ -d "$LEGACY_DIR" ]; then
              mv "$LEGACY_DIR" "$REPO_DIR"
              cd "$REPO_DIR"
            else
              git clone https://github.com/oksk1111/AlphaTrader.git "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            git remote set-url origin https://github.com/oksk1111/AlphaTrader.git
            
            # 1. Update Code
            echo "📥 (Step 1/3) Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Update Environment Variables (Telegram)
            echo "🔧 (Step 2/3) Updating configuration..."
            if [ -f .env ]; then
              grep -v "TELEGRAM_" .env > .env.tmp || true
              mv .env.tmp .env
            fi
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" >> .env
            echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> .env
            
            # 3. Execute Deployment Script
            echo "🔄 (Step 3/3) Running local deploy script..."
            chmod +x deployment/deploy.sh
            ./deployment/deploy.sh

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram skipped"
            exit 0
          fi
          
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          COMMIT="${{ github.sha }}"
          STATUS="${{ job.status }}"
          ACTOR="${{ github.actor }}"
          
          if [ "$STATUS" == "success" ]; then
            MSG="✅ *Alpha Trader 배포 성공*%0A📅 $TIMESTAMP%0A👤 $ACTOR%0A🔗 Commit: ${COMMIT:0:7}"
          else
            MSG="❌ *Alpha Trader 배포 실패*%0A📅 $TIMESTAMP%0A👤 $ACTOR%0A🔗 Commit: ${COMMIT:0:7}%0A⚠️ 확인 요망"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             -d chat_id="${TELEGRAM_CHAT_ID}"             -d text="${MSG}"             -d parse_mode="Markdown" || true
