name: Deploy to Oracle Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================================================
  # [v6.0] 배포 전 전략 검증 게이트
  #
  # 이 잡이 없어서 "돌아는 가는데 아무것도 사지 않는" 전략이 몇 달간 프로덕션에
  # 머물렀다. 문법도 맞고 프로세스도 살아 있고 예외도 안 났기 때문에 어떤 자동
  # 검사도 이를 잡지 못했다. 이제 매수가 실제로 발생하는지를 배포 조건으로 만든다.
  # ==========================================================================
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Syntax check
        run: python -c "import ast, io; ast.parse(io.open('run_bot.py', encoding='utf-8').read())"

      - name: Unit & integration tests
        # 실제 토스 API 를 호출하는 테스트는 CI 에 자격증명이 없으므로 제외.
        run: |
          pytest tests/ -q --ignore=tests/test_portfolio_manager.py

      - name: v6.0 회귀 테스트 (5대 사고 원인)
        run: pytest tests/test_v60_strategy.py tests/test_v60_integration.py -q

      - name: v6.1 회귀 테스트 (관측 실패 + 소액계좌 사이징)
        # 2026-09-10 사고: 대시보드가 봇이 쓰지 않는 로그 파일을 보여주고,
        # 시장 상태를 서머타임 미반영으로 CLOSED 라 표시하고, 프로세스 존재만으로
        # "Running" 이라 표시했다. 그 상태에서 US $330 계좌는 사이징이 0주로
        # 죽어 있었다. 계기판이 거짓말하면 전략을 아무리 고쳐도 소용이 없다.
        run: pytest tests/test_v61_observability.py -q

      - name: Toss shadow 회귀 테스트
        run: pytest tests/test_toss_broker.py tests/test_toss_stream.py tests/test_intraday_strategy.py tests/test_market_data_store.py tests/test_walk_forward_intraday.py tests/test_shadow_config.py -q

      - name: v7.0 회귀 테스트 (모멘텀 로테이션 + 관측 2차)
        # 2026-10-01 실데이터 백테스트: v6.1 구조는 KR CAGR +4.7%/MDD -46.7%,
        # US CAGR -12.4%/MDD -79.5%. 문제는 타이밍이 아니라 '무엇을 들고 있나'
        # (21종목 희석 + 3x 레버리지 + 장중 꼬리 손절)였다. 로테이션 판단·배선,
        # 레버리지/개별주 재유입, 시장 간 자금 공유, 대시보드 로그 소스를 잠근다.
        run: pytest tests/test_v70_rotation.py -q

      - name: v8.0 회귀 테스트 (토스증권 어댑터 + 웹소켓 체결 확인)
        # 없음/실패 구분, KR 총평가 = 주식 + 예수금, US +1% 지정가, 거부 주문을 성공으로
        # 세지 않는가, 토큰을 봇·대시보드가 서로 revoke 하지 않는가.
        run: pytest tests/test_v80_toss.py -q

      - name: 전략 검증 루프 (국면 + 청산품질 + 소액계좌)
        # 종료코드 0 = 합격. 실패 조건:
        #   · 상승 국면에서 자본이 놀고 있음      (v5.x 회귀)
        #   · 위험 국면에서 과다 노출             (v4.0 회귀)
        #   · 캡처율 미달 — 번 것을 청산이 깎아먹음 (v6.0 에서 발견)
        #   · 회전손실 과다 — 손절 휩쏘            (v6.0 에서 발견)
        #   · 실계좌 잔고에서 매수 수량 0         (2026-09-10 사고)
        # 단일 시드 통과는 운일 수 있으므로 시드 5개 평균으로 판정한다.
        run: |
          python scripts/verify_strategy_loop.py --sessions 80 --seed 42 --seeds 5 --quiet
          python scripts/verify_strategy_loop.py --sessions 80 --seed 7 --seeds 5 --quiet

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
          TOSS_ACCOUNT_SEQ: ${{ secrets.TOSS_ACCOUNT_SEQ }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          # shadow(기본) | live — Settings > Secrets and variables > Actions > Variables
          EXECUTION_MODE: ${{ vars.EXECUTION_MODE }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          envs: TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,TOSS_CLIENT_ID,TOSS_CLIENT_SECRET,TOSS_ACCOUNT_SEQ,LOGIN_PASSWORD,EXECUTION_MODE
          script: |
            echo "🚀 Starting deployment via GitHub Actions..."
            REPO_DIR="$HOME/AlphaTrader"
            LEGACY_DIR="$HOME/Alphatrader"

            if [ -d "$REPO_DIR" ]; then
              cd "$REPO_DIR"
            elif [ -d "$LEGACY_DIR" ]; then
              mv "$LEGACY_DIR" "$REPO_DIR"
              cd "$REPO_DIR"
            else
              git clone https://github.com/oksk1111/AlphaTrader.git "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            git remote set-url origin https://github.com/oksk1111/AlphaTrader.git
            
            # 1. Update Code
            echo "📥 (Step 1/3) Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Update deployment-managed environment variables.
            #    값이 있는 시크릿만 덮어쓴다 — 시크릿 등록 전에 배포돼도 서버 .env 를 비우지 않는다.
            #    v8.0: 한국투자증권 제거 → KIS_* / BROKER / MARKET_DATA_BROKER 줄은 지운다.
            #    EXECUTION_MODE 는 저장소 변수(vars)에서, 없으면 shadow (주문 미전송).
            echo "🔧 (Step 2/3) Updating configuration..."
            touch .env
            grep -Ev '^(KIS_|BROKER=|MARKET_DATA_BROKER=|EXECUTION_MODE=)' .env > .env.tmp || true
            mv .env.tmp .env
            set_env() {
              if [ -n "$2" ]; then
                grep -v "^$1=" .env > .env.tmp || true
                mv .env.tmp .env
                echo "$1=$2" >> .env
              fi
            }
            set_env TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
            set_env TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"
            set_env TOSS_CLIENT_ID "$TOSS_CLIENT_ID"
            set_env TOSS_CLIENT_SECRET "$TOSS_CLIENT_SECRET"
            set_env TOSS_ACCOUNT_SEQ "$TOSS_ACCOUNT_SEQ"
            set_env LOGIN_PASSWORD "$LOGIN_PASSWORD"
            export EXECUTION_MODE="${EXECUTION_MODE:-shadow}"   # 자식 프로세스(봇)가 빈 값을 물려받지 않게
            echo "EXECUTION_MODE=$EXECUTION_MODE" >> .env
            chmod 600 .env
            grep -q "^TOSS_CLIENT_ID=." .env || echo "⚠️ TOSS_CLIENT_ID 미설정 — GitHub Secrets 에 등록하세요 (봇이 시세·주문을 못 합니다)"
            echo "ℹ️ EXECUTION_MODE=${EXECUTION_MODE:-shadow}"
            
            # 3. Execute Deployment Script
            echo "🔄 (Step 3/3) Running local deploy script..."
            chmod +x deployment/deploy.sh
            ./deployment/deploy.sh

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram skipped"
            exit 0
          fi
          
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          COMMIT="${{ github.sha }}"
          STATUS="${{ job.status }}"
          ACTOR="${{ github.actor }}"
          
          if [ "$STATUS" == "success" ]; then
            MSG="✅ *Alpha Trader 배포 성공*%0A📅 $TIMESTAMP%0A👤 $ACTOR%0A🔗 Commit: ${COMMIT:0:7}"
          else
            MSG="❌ *Alpha Trader 배포 실패*%0A📅 $TIMESTAMP%0A👤 $ACTOR%0A🔗 Commit: ${COMMIT:0:7}%0A⚠️ 확인 요망"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             -d chat_id="${TELEGRAM_CHAT_ID}"             -d text="${MSG}"             -d parse_mode="Markdown" || true
